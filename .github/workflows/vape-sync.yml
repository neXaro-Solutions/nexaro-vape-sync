name: neXaro VAPE Händler-Erstabgleich

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
  with:
    node-version: 24
    package-manager-cache: false

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Händler-Erstabgleich
        env:
          DEALER_LOGIN_URL: https://e-zigaretten-handel.de/ezigaretten/
          PRODUCT_ROOT_URL: https://e-zigaretten-handel.de/ezigaretten/
          DEALER_USER: ${{ secrets.DEALER_USER }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          HEADLESS: true
          MAX_CATEGORY_TARGETS: 50
          MAX_PAGES_PER_TARGET: 30
          MAX_DETAIL_PAGES: 600
          MATCH_THRESHOLD: 0.72
          MATCH_REVIEW_THRESHOLD: 0.58
        run: npm run sync

      - name: Ergebnis prüfen
        run: |
          test -f out/summary.json
          test -f out/mapping.json
          cat out/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: nexaro-vape-first-mapping-${{ github.run_number }}
          path: out/
          retention-days: 14
