name: neXaro VAPE Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run VAPE Sync
        env:
          DEALER_URL: ${{ secrets.DEALER_URL }}
          DEALER_LOGIN_URL: ${{ secrets.DEALER_LOGIN_URL }}
          DEALER_USER: ${{ secrets.DEALER_USER }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}

          HEADLESS: "true"

          LOGIN_USER_SELECTOR: ${{ secrets.LOGIN_USER_SELECTOR }}
          LOGIN_PASSWORD_SELECTOR: ${{ secrets.LOGIN_PASSWORD_SELECTOR }}
          LOGIN_SUBMIT_SELECTOR: ${{ secrets.LOGIN_SUBMIT_SELECTOR }}

          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          CSV_EXPORT_SELECTOR: ${{ secrets.CSV_EXPORT_SELECTOR }}
        run: node sync.mjs

      - name: Check generated catalog
        run: |
          if [ ! -f data/products.json ]; then
            echo "FEHLER: data/products.json wurde nicht erzeugt."
            exit 1
          fi

          echo "VAPE-Katalog erfolgreich erzeugt."
          wc -c data/products.json

      - name: Commit updated catalog
        run: |
          git config user.name "neXaro VAPE Sync"
          git config user.email "actions@users.noreply.github.com"

          git add data/products.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen am VAPE-Katalog."
          else
            git commit -m "Automatischer VAPE-Katalog Sync"
            git push
          fi
