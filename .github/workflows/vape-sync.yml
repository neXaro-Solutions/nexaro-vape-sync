name: neXaro VAPE Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run VAPE Sync
        env:
          DEALER_URL: "https://e-zigaretten-handel.de/ezigaretten/"
          DEALER_USER: ${{ secrets.DEALER_USER }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          HEADLESS: "true"
        run: npm run sync

      - name: Check generated catalog
        run: |
          if [ ! -f out/products.json ]; then
            echo "FEHLER: out/products.json wurde nicht erzeugt."
            exit 1
          fi

          echo "VAPE-Katalog erfolgreich erzeugt."
          wc -c out/products.json

      - name: Upload sync result
        uses: actions/upload-artifact@v4
        with:
          name: nexaro-vape-sync-${{ github.run_number }}
          path: out/
          retention-days: 7
