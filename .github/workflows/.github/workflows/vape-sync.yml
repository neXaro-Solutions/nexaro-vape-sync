name: neXaro VAPE Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dealer sync
        env:
          DEALER_URL: https://e-zigaretten-handel.de/ezigaretten/
          DEALER_USER: ${{ secrets.DEALER_USER }}
          DEALER_PASSWORD: ${{ secrets.DEALER_PASSWORD }}
          DEALER_LOGIN_URL: ${{ secrets.DEALER_LOGIN_URL }}
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          LOGIN_USER_SELECTOR: ${{ secrets.LOGIN_USER_SELECTOR }}
          LOGIN_PASSWORD_SELECTOR: ${{ secrets.LOGIN_PASSWORD_SELECTOR }}
          LOGIN_SUBMIT_SELECTOR: ${{ secrets.LOGIN_SUBMIT_SELECTOR }}
        run: npm run sync

      - name: Publish safe sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaro-vape-sync-${{ github.run_number }}
          path: out/
          retention-days: 7
